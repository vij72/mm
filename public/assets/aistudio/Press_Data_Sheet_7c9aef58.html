<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Press Data Sheet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky control bar (date / shift) above a wide punching grid with live totals and an action bar */
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#16202e; --muted:#5b6778; --line:#d3dae4;
  --brand:#1f4e78; --brand-ink:#ffffff; --brand-soft:#dce8f4; --calc:#f1f4f8;
  --ok:#17794a; --ok-bg:#dcf2e5; --warn:#8a5a00; --warn-bg:#fdefc8;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1620; --panel:#18222f; --ink:#e6ebf2; --muted:#93a0b2; --line:#2c394a;
  --brand:#5a9bd5; --brand-ink:#0b1420; --brand-soft:#1f3248; --calc:#1d2938;
  --ok:#5fd08e; --ok-bg:#16382a; --warn:#f0c45e; --warn-bg:#3d3211; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1620; --panel:#18222f; --ink:#e6ebf2; --muted:#93a0b2; --line:#2c394a;
  --brand:#5a9bd5; --brand-ink:#0b1420; --brand-soft:#1f3248; --calc:#1d2938;
  --ok:#5fd08e; --ok-bg:#16382a; --warn:#f0c45e; --warn-bg:#3d3211; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;
  padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1800px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 6px;display:flex;flex-direction:column;gap:10px}
.title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700;margin:0}
.clock{font-family:var(--mono);color:var(--muted);font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:6px}.live i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.live.off i{background:var(--muted)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
select,input[type=date],input[type=text],input[type=number],input[type=time]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 9px;min-height:38px}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.datebox{display:flex;gap:6px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-height:38px;padding:0 14px;font-weight:500}
button:hover{border-color:var(--brand)}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-radius:0;min-height:36px}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);font-weight:600}
.chk{display:flex;align-items:center;gap:7px;min-height:38px;white-space:nowrap}
.chk input{width:17px;height:17px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.phead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.phead h2{margin:0;font-size:14.5px;font-weight:600;letter-spacing:.02em}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.status{font-size:12px;padding:4px 10px;border-radius:999px;font-weight:600}
.status.saved{background:var(--ok-bg);color:var(--ok)}.status.dirty{background:var(--warn-bg);color:var(--warn)}.status.new{background:var(--brand-soft);color:var(--brand)}
.tablewrap{overflow:auto;max-height:72vh}
table{border-collapse:separate;border-spacing:0;min-width:2300px;width:100%}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:2px 4px;text-align:left;vertical-align:middle}
th{background:var(--brand);color:var(--brand-ink);font-size:11px;font-weight:600;position:sticky;top:0;z-index:2;line-height:1.25;padding:7px 5px;text-align:center}
thead tr.r2 th{top:30px}
td.sl{font-family:var(--mono);color:var(--muted);text-align:center;width:38px}
td.calc{background:var(--calc);font-family:var(--mono);font-size:12.5px;text-align:right;white-space:nowrap;padding-inline:8px}
td.ck{text-align:center}td.ck input{width:17px;height:17px}
td input[type=text],td input[type=number],td input[type=time],td select{width:100%;border:1px solid transparent;background:transparent;padding:5px 5px;min-height:30px;border-radius:4px;font-size:13px}
td input:hover,td select:hover,td input:focus,td select:focus{border-color:var(--line);background:var(--panel)}
td input[type=number]{text-align:right;font-family:var(--mono)}
td input.miss{border-color:var(--warn);background:var(--warn-bg)}
td input[type=time]{font-family:var(--mono)}
td.x button{min-height:26px;padding:0 8px;border-color:transparent;background:transparent;color:var(--muted)}
tr.tot td{background:var(--brand-soft);font-weight:600;font-family:var(--mono);font-size:12px;border-bottom:0;text-align:right;position:sticky;bottom:0;z-index:1}
tr.tot td.lab{font-family:var(--font);text-align:left}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.sp{flex:1}
.note{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:20;max-width:90vw}
.tabs{display:flex;gap:6px}.tabs button{min-height:36px;font-weight:600}.tabs button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.wctl{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:12px 14px;border-bottom:1px solid var(--line)}
#wgrid td.n{font-family:var(--mono);font-size:12.5px;text-align:right;padding:5px 8px;white-space:nowrap}
#wgrid td.z{color:var(--muted)}#wgrid td.t{background:var(--calc);font-weight:600}
#wgrid td.nm{white-space:nowrap;padding:5px 8px}
#wgrid th.d{min-width:46px}
.sw{display:flex;gap:6px;align-items:center}
.sw button{width:26px;height:26px;min-height:26px;padding:0;border-radius:50%;border:2px solid var(--line)}
.sw button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel) inset}
</style>

<div class="wrap">
  <header class="top">
    <div class="title"><h1>Press Section Daily Data Sheet</h1>
      <div class="clock"><span id="clock">--</span><span class="live" id="live"><i></i><span id="livetxt">Live</span></span></div></div>
    <div class="tabs" role="tablist"><button id="tabD" role="tab" aria-pressed="true">Daily Data Sheet</button><button id="tabW" role="tab" aria-pressed="false">Wages Sheet</button></div>
    <div class="controls">
     <div class="controls" id="dailyCtl">
      <div class="field"><label class="lbl" for="date">Date</label>
        <div class="datebox"><button id="prev" aria-label="Previous day">&larr;</button><input type="date" id="date"><button id="next" aria-label="Next day">&rarr;</button></div></div>
      <div class="field"><span class="lbl">Shift</span>
        <div class="seg" role="group" aria-label="Shift"><button id="sDay" aria-pressed="true">Day</button><button id="sNight" aria-pressed="false">Night</button></div></div>
      <label class="chk" for="auto"><input type="checkbox" id="auto" checked> Auto date &amp; shift</label>
      <label class="chk" for="autosave"><input type="checkbox" id="autosave" checked> Auto-save</label>
     </div>
      <div class="field"><label class="lbl" for="theme">Theme</label>
        <div class="datebox"><select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
        <div class="sw" id="sw" role="group" aria-label="Accent colour"></div></div></div>
    </div>
  </header>

  <section class="panel" id="viewD">
    <div class="phead">
      <div><h2 id="ptitle"></h2><div class="meta" id="pmeta"></div></div>
      <span class="status new" id="status">Not saved yet</span>
    </div>
    <div class="tablewrap"><table id="grid"></table></div>
    <div class="actions">
      <button class="primary" id="save">Save</button>
      <button id="addrow">+ Add row</button>
      <button id="times">Fill shift timings</button>
      <button id="clear">Clear all entries</button>
      <span class="sp"></span>
      <select id="scope" aria-label="Export scope"><option value="one">This shift</option><option value="both">Day + Night</option></select>
      <button id="xls">Excel</button><button id="pdf">PDF</button>
    </div>
  </section>
  <section class="panel" id="viewW" hidden>
    <div class="phead">
      <div><h2 id="wtitle">WAGES SHEET</h2><div class="meta" id="wmeta"></div></div>
      <span class="status saved" id="wstat">Live</span>
    </div>
    <div class="wctl">
      <div class="field"><label class="lbl" for="wf">From</label><input type="date" id="wf"></div>
      <div class="field"><label class="lbl" for="wt">To</label><input type="date" id="wt"></div>
      <div class="field"><label class="lbl" for="wm">Show</label><select id="wm"><option value="pay">Hours payable</option><option value="phys">Physical hours</option><option value="good">Good bricks</option></select></div>
      <div class="field"><label class="lbl" for="ws">Shift</label><select id="ws"><option value="ALL">Day + Night</option><option value="DAY">Day only</option><option value="NIGHT">Night only</option></select></div>
      <div class="field"><label class="lbl" for="wr">Rate per hour (optional)</label><input type="number" id="wr" min="0" step="any" placeholder="0"></div>
      <label class="chk" for="wonly"><input type="checkbox" id="wonly"> Only employees with data</label>
      <span class="sp"></span><button class="primary" id="wxls">Download Excel</button>
    </div>
    <div class="tablewrap"><table id="wgrid" style="min-width:900px"></table></div>
  </section>
  <div class="note" id="dnote">Grey cells calculate automatically. Target (12 hrs) fills from your Target Press Data when you pick Press No. and Item. Auto-save runs a few seconds after you stop typing.</div>
</div>
<div class="toast" id="toast" hidden></div>
<datalist id="items"></datalist>

/* sync target of 12 hrs from Target Press Data; returns true when a press+item pair has no target */
function syncTarget(r,i,force){
  const a=autoTarget(r),have=r.press&&String(r.item||"").trim();
  if(a!==""){if(force||String(r.tgt)===""||r.tgtAuto){r.tgt=a;r.tgtAuto=true}}

}

function headHTML(){

  let r1="<tr>",r2="<tr class='r2'>";

    if(!inG(c))r1+=`<th rowspan="2">${c.h}</th>`;

const letter=i=>{let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
const HEADS=["SL. NO",...COLS.map(c=>c.h)];
function sheetFor(d,shift){
  const banner=`DATE: ${dmy(state.date)}      SHIFT: ${shift}      PRESS SECTION DAILY DATA SHEET`;
  const L={};COLS.forEach((c,i)=>L[c.k]=letter(i+1));
  const sub=HEADS.map(()=>"");sub[3]="PRESS OPERATOR";sub[4]="HELPER";sub[5]="LABOUR";sub[6]="M";sub[7]="F";sub[18]=12;
  const aoa=[[banner],HEADS,sub];
  const first=4,last=first+d.rows.length-1;
  d.rows.forEach((r,i)=>{
    const rn=first+i;

    COLS.forEach(c=>{
      let v=r[c.k];
      if(c.t==="check")v=v?"YES":"";
      else if(c.t==="calc"){const val=c.f(r);v=c.x?{f:c.x(rn,L).replace("$TH$","$S$3"),v:val===""?"":val}:val}
      else if(c.t==="num")v=v===""||v==null?"":num(v);
      else if(c.t==="time"){v=v?{t:"n",v:(num(v.split(":")[0])*60+num(v.split(":")[1]))/1440,z:"h:mm AM/PM"}:""}
      row.push(v);
    });
    aoa.push(row);
  });
  const tot=["TOTALS","",""];
  COLS.slice(2).forEach(c=>{
    const col=L[c.k],rg=`${col}${first}:${col}${last}`;
    if(c.tot==="sum"){let s=d.rows.reduce((a,r)=>a+num(c.t==="calc"?c.f(r):r[c.k]),0);tot.push({f:`SUM(${rg})`,v:s})}

};
/* ---------- theme ---------- */
const ACC={blue:["#1f4e78","#5a9bd5","#dce8f4","#1f3248"],green:["#1d6b45","#5fd08e","#dcf2e5","#16382a"],orange:["#a8480b","#f0a05a","#fde6d2","#46280f"],purple:["#5b3f9a","#a98ae0","#e8e0f7","#2f2548"],slate:["#3a4656","#aab6c6","#e1e6ed","#2a3340"]};
const prefs={theme:"system",accent:"blue"};
try{Object.assign(prefs,JSON.parse(localStorage.getItem("psd:prefs"))||{})}catch(e){}
const mq=window.matchMedia?matchMedia("(prefers-color-scheme: dark)"):null;
function applyTheme(){
  const root=document.documentElement;
  if(prefs.theme==="system")root.removeAttribute("data-theme");else root.setAttribute("data-theme",prefs.theme);
  const dark=prefs.theme==="dark"||(prefs.theme==="system"&&mq&&mq.matches);
  const a=ACC[prefs.accent]||ACC.blue;
  root.style.setProperty("--brand",dark?a[1]:a[0]);root.style.setProperty("--brand-soft",dark?a[3]:a[2]);
  root.style.setProperty("--brand-ink",dark?"#0b1420":"#ffffff");
  $("theme").value=prefs.theme;
  document.querySelectorAll("#sw button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.a===prefs.accent));
}
$("sw").innerHTML=Object.keys(ACC).map(k=>`<button data-a="${k}" title="${k}" aria-label="${k} accent" aria-pressed="false" style="background:${ACC[k][0]}"></button>`).join("");
$("sw").onclick=e=>{const b=e.target.closest("button");if(!b)return;prefs.accent=b.dataset.a;applyTheme();savePrefs()};
$("theme").onchange=e=>{prefs.theme=e.target.value;applyTheme();savePrefs()};
function savePrefs(){try{localStorage.setItem("psd:prefs",JSON.stringify(prefs))}catch(e){}}
if(mq&&mq.addEventListener)mq.addEventListener("change",applyTheme);
applyTheme();
/* ---------- clock + auto ---------- */
function tick(){
  const n=new Date();
  $("clock").childNodes[0].textContent=n.toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"short",year:"numeric"})+"  "+n.toLocaleTimeString("en-GB");
  if(state.auto&&state.date){const s=nowShift();if(s.date!==state.date||s.shift!==state.shift)go(s.date,s.shift)}
}
(async()=>{
  const n=nowShift();state.date=n.date;state.shift=n.shift;subscribe();
  try{const c=window.claude;if(c&&c.use){db=await c.use("db");dl=await c.use("downloads")}}catch(e){}
  subscribe();
})();
tick();setInterval(tick,1000);
</script>
